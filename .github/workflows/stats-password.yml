name: Email stats password

on:
  workflow_dispatch:

permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Email the stats password
        env:
          STATS_PASSWORD: ${{ secrets.STATS_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${STATS_PASSWORD}" ]; then
            echo "The STATS_PASSWORD secret is missing."
            exit 1
          fi
          payload=$(jq -n --arg password "$STATS_PASSWORD" '{_subject:"Portfolio stats password",_captcha:"false",_template:"box",password:$password}')
          resp=$(curl -sS -X POST "https://formsubmit.co/ajax/rawat.raghav3w@gmail.com" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "Origin: https://rawatraghav.github.io" \
            -H "Referer: https://rawatraghav.github.io/PersonalPortfolio/stats" \
            -d "$payload")
          success=$(printf '%s' "$resp" | jq -r '.success // empty')
          message=$(printf '%s' "$resp" | jq -r '.message // empty')
          if printf '%s' "$message" | grep -Eqi 'activat|confirm'; then
            echo "Check rawat.raghav3w@gmail.com for an activation link, then run this workflow again."
            exit 1
          fi
          if [ "$success" != "true" ]; then
            echo "The email could not be sent."
            exit 1
          fi
          echo "Sent to rawat.raghav3w@gmail.com."
